  if(k==='advance'){ S.dlg=null; if(S.sr==='pre') S.prestep=(S.prestep??1)+1; else if(SRD()) S.vstep++; else if(S.step===2&&C().risk[0]==='Medium'){S.step=5; S.skipped=true} else S.step++; S.view=null; S.more=false; S.log.unshift([now(),'Moved to '+SSTEPS()[SCUR()][0],'Staff',S.cs,'step'])}
  if(k==='rcancel'){S.rk=null}
  if(k==='rsave'){const f=S.rk, rs=(document.querySelector('[data-rreason]')||{}).value?.trim(), base=FACT.find(x=>x[0]===f)[2], prev=(S.ovr[S.cs+':'+f]||[base])[0];
    if(!S.rpick||!rs){render(); return}
    if(S.rpick!==prev){S.ovr[S.cs+':'+f]=[S.rpick,rs]; S.stale=true; S.log.unshift([now(),`${f} rating: ${prev} → ${S.rpick} · ${rs} · Compliance Officer`,'Staff',S.cs,f])}
    S.rk=null}
  if(k==='regen'){S.err++; S.stale=false; S.log.unshift([now(),`ERR-${S.err} generated`,'Staff',S.cs,'ERR'])}
  if(k==='srdd') S.srdd=!S.srdd;
  if(k==='prev'||k==='nextdoc'){const all=docs().filter(x=>x.f), i=all.findIndex(x=>x.k===S.sel); S.sel=all[(i+(k==='prev'?-1:1)+all.length)%all.length].k; S.back=false}
  if(k==='ecancel') S.editing=null;
  if(k==='esave'){const l=S.editing, i=document.querySelector('[data-ein]'), nv=i.value.trim(), old=S.cs+':'+l in S.edits?S.edits[S.cs+':'+l]:currentDefault(l);
    if(nv&&nv!==old){S.edits[ek(l)]=nv; S.log.unshift([now(),`${l.startsWith('ec:')?'ICP form · '+l.slice(3):l.includes('|')?l.replace('|',' · '):l.includes(':')?((docs().find(x=>x.k===l.split(':')[0])||{}).t+' · '+l.split(':')[1]):l}: ${old||'Not given'} → ${nv} · corrected`,'Staff',S.cs,l])}
    S.editing=null}
  render();
}
document.addEventListener('click',e=>{const t=e.target;
  const tb=t.closest('[data-tab]'); if(tb){S.editDoc=null; S.tab=tb.dataset.tab; render(); return}
  const nv=t.closest('[data-nav]'); if(nv){S.screen=nv.dataset.nav; render(); scrollTo(0,0); return}
  const qf=t.closest('[data-qf]'); if(qf){S.qf=qf.dataset.qf; render(); return}
  const oq=t.closest('[data-openq]'); if(oq){const [cs,sr]=oq.dataset.openq.split(':'); S.cs=cs; S.sr=sr; S.screen='case'; S.tab='documents'; S.sel=null; render(); scrollTo(0,0); return}
  const sv=t.closest('[data-sr]'); if(sv){S.srdd=false; S.sr=sv.dataset.sr; S.sel=null; S.back=false; render(); return}
  const rk=t.closest('[data-rk]'); if(rk&&S.role==='comp'){S.rk=rk.dataset.rk; S.rpick=null; render(); return}
  const rt=t.closest('[data-rate]'); if(rt){const keep=(document.querySelector('[data-rreason]')||{}).value; S.rpick=rt.dataset.rate; render(); const i=document.querySelector('[data-rreason]'); if(i){i.value=keep||''}; return}
  const vw=t.closest('[data-view]'); if(vw){const i=+vw.dataset.view, cur=SCUR(); S.view=i===cur?null:i; render(); return}
  const edd=t.closest('[data-editdoc]'); if(edd){S.editDoc=edd.dataset.editdoc; S.ldraft={}; render(); return}
  const rv=t.closest('[data-resolve]'); if(rv){S.resolving=rv.dataset.resolve; S.rpick2=null; render(); return}
  const rp=t.closest('[data-rpick]'); if(rp){const keep=(document.querySelector('[data-rnote]')||{}).value; S.rpick2=rp.dataset.rpick; render(); const i=document.querySelector('[data-rnote]'); if(i) i.value=keep||''; return}
  const ws=t.closest('[data-why]'); if(ws){S.why=ws.dataset.why; render(); return}
  const sc=t.closest('[data-src]'); if(sc){S.src=sc.dataset.src; render(); return}
  const tk=t.closest('[data-task]'); if(tk&&!tk.disabled){const k=tk.dataset.task; if(S.sr==='pre'&&['prenames','prescreen','presend','precert'].includes(k)){ S.t['co:pre:'+k]=true; const L={prenames:'Name confirmed · Harbour Interiors Limited',prescreen:'Manager screened · no match',presend:`Security approval letter sent to ICP · ${S.preNo}`,precert:'Cleared certificate uploaded'}; S.log.unshift([now(),L[k],'Staff',S.cs,k]); if(k==='precert') S.prestep=3; render(); return } if(k==='echsend'){S.t['fl:ech:echsend']=true; S.echstep=1; S.log.unshift([now(),`e-Channel sent to ICP · ${S.echNo}`,'Staff',S.cs,k]); render(); return} if(S.sr==='ec'&&(k==='ecapply'||k==='eccard')){ S.t['fl:ec:'+k]=true; S.ecstep=k==='ecapply'?1:2; S.ecWrong=k==='eccard'; S.log.unshift([now(),k==='ecapply'?`Applied at ICP · ${S.ecNo}`:'Establishment card uploaded · name does not match','Staff',S.cs,k]); render(); return } if(k==='name') S.name=true; else S.t[S.cs+':'+S.sr+':'+k]=true; if(k==='letter') S.letter=true; S.log.unshift([now(),tk.closest('li')?.querySelector('.text-sm')?.innerText||document.querySelector('h2')?.innerText||k,'Staff',S.cs,k]); render(); return}
  const pw=t.closest('[data-prewhy]'); if(pw){S.preWhy=pw.dataset.prewhy; render(); return}
  const ew=t.closest('[data-ecwhy]'); if(ew){S.ecWhy=ew.dataset.ecwhy; render(); return}
  const rl=t.closest('[data-role]'); if(rl){S.role=rl.dataset.role; S.um=false; render(); return}
  const af=t.closest('[data-af]'); if(af){S.af=af.dataset.af; render(); return}
  const sl=t.closest('[data-sel]'); if(sl){S.sel=sl.dataset.sel; S.back=false; S.dd=false; render(); return}
  const rs=t.closest('[data-reason]'); if(rs){S.reason=rs.dataset.reason; render(); return}
  const ag=t.closest('[data-again]'); if(ag){const dd=docs().find(x=>x.k===ag.dataset.again); delete S.docs[dkey(dd)]; S.sel=dd.k; S.log.unshift([now(),dd.t+' reopened for review','Staff',S.cs,'doc']); render(); return}
  const ro=t.closest('[data-reopen]'); if(ro){S.viewDoc='mock:'+ro.dataset.reopen; render(); return}
  const cp=t.closest('[data-copy]'); if(cp){ try{navigator.clipboard.writeText(cp.dataset.copy)}catch(_){} const v=cp.lastElementChild; const old=v.innerHTML; v.innerHTML='<span class="text-ok">Copied</span>'; setTimeout(()=>{v.innerHTML=old},700); return}
  const vd=t.closest('[data-view-doc]'); if(vd){S.viewDoc=vd.dataset.viewDoc; render(); return}
  if(t.closest('[data-closeview]')){S.viewDoc=null; render(); return}
  if(t.closest('[data-closeportal]')){S.portal=false; render(); return}
  const ed=t.closest('[data-edit]'); if(ed){S.editing=ed.dataset.edit; render(); const i=document.querySelector('[data-ein]'); if(i){i.focus(); i.select()} return}
  const a=t.closest('[data-a]'); if(a&&!a.disabled) act(a.dataset.a);
});
document.addEventListener('input',e=>{ if(e.target.dataset.preno!==undefined){ S.preNo=e.target.value; const b=document.querySelector('[data-task="presend"]'); if(b){const on=!!S.preNo.trim(); b.disabled=!on; b.className='h-9 rounded-md px-4 text-sm font-medium '+(on?'bg-foreground text-background':'border border-border text-muted-foreground')} } if(e.target.dataset.echno!==undefined){ S.echNo=e.target.value; const b=document.querySelector('[data-task="echsend"]'); if(b){const on=!!S.echNo.trim(); b.disabled=!on; b.className='h-9 rounded-md px-4 text-sm font-medium '+(on?'bg-foreground text-background':'border border-border text-muted-foreground')} } if(e.target.dataset.ecno!==undefined){ S.ecNo=e.target.value; const b=document.querySelector('[data-task="ecapply"]'); if(b){ const on=!!S.ecNo.trim(); b.disabled=!on; b.className='h-9 rounded-md px-4 text-sm font-medium '+(on?'bg-foreground text-background':'border border-border text-muted-foreground') } } if(e.target.dataset.lf!==undefined){ S.lt=S.lt||{}; S.ldraft=S.ldraft||{}; S.ldraft[e.target.dataset.lf]=e.target.value; const box=document.querySelector('.sticky-v [style*="scale(.8)"]'); if(box){ const save=S.lt; S.lt={...S.lt}; Object.entries(S.ldraft).forEach(([k,v])=>S.lt[S.cs+':'+k]=v); box.innerHTML=letterHTML(); S.lt=save } } if(e.target.dataset.icpno!==undefined){ S.icpNo=e.target.value; const b=document.querySelector('[data-task="letter"]'); if(b) b.disabled=!S.icpNo.trim() } });
document.addEventListener('keydown',e=>{ if(S.editing&&e.target.dataset&&e.target.dataset.ein!==undefined){ if(e.key==='Enter') act('esave'); if(e.key==='Escape') act('ecancel'); return } if(S.tab!=='documents'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const d=docs().find(x=>x.k===S.sel); if(!d||!d.f) { if(e.key==='j'){const i=docs().indexOf(d); S.sel=docs()[(i+1)%docs().length].k; render()} return }
  if(e.key==='a'&&!S.docs[dkey(d)]) act('accept');
  if(e.key==='r'&&!S.docs[dkey(d)]) act('startback');
  if(e.key==='j') act('nextdoc');
  if(e.key==='k') act('prev');
});
render();

if(window.FLOW){
  const base=()=>{Object.assign(S,{cs:'co',sr:'reg',role:'gs',screen:'case',tab:'application',step:2,name:true,icpNo:'ICP-55120',mgrRej:false,wd:false,checks:1,dlg:null,more:false}); S.t['co:reg:name']=true; S.t['co:reg:docs']=true; S.t['co:reg:letter']=true; delete S.t['co:reg:cert']};
  const FS=[['Waiting on ICP',()=>{base()}],['ICP did not clear the manager',()=>{base(); S.mgrRej=true}],['New manager, check again',()=>{base(); S.checks=2; delete S.t['co:reg:letter']; S.icpNo=''}],['Withdrawn and refunded',()=>{base(); S.wd=true}]];
  const cur=()=>S.wd?3:S.mgrRej?1:(S.checks||1)>1?2:0;
  const st=document.createElement('style'); st.textContent=`.fsbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:#16191b;color:#e9eeee;font-size:13px}.fsbar b{font-size:12px;letter-spacing:.06em;color:#9fb3b3}.fsbar button{display:inline-flex;align-items:center;gap:7px;border-radius:100px;padding:5px 12px 5px 6px;background:#24302f;color:#fff;border:1px solid #3a4a49;font:inherit;cursor:pointer}.fsbar button i{font-style:normal;display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;background:#3a4a49;font-size:11px;font-weight:700}.fsbar button.on{background:#e9eeee;color:#16191b;border-color:#e9eeee}.fsbar button.on i{background:#3f6f6d;color:#fff}nav.side{pointer-events:none}#topbar{pointer-events:none}`; document.head.appendChild(st);
  const bar=document.createElement('div'); bar.className='fsbar'; document.body.prepend(bar);
  const drawStrip=()=>{const c=cur(); bar.innerHTML='<b>WIREFRAME</b>'+FS.map(([t],i)=>`<button data-fs="${i}" class="${i===c?'on':''}"><i>${i+1}</i>${t}</button>`).join('')};
  bar.addEventListener('click',e=>{const b=e.target.closest('[data-fs]'); if(b){FS[+b.dataset.fs][1](); render()}});
  const r0=render; render=function(){r0(); drawStrip()};
  base(); render();
}
