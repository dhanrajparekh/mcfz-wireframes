<!doctype html>
<html lang="en" class="__variable_c8daab __variable_595324 __variable_b7e8f4 dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manager Not Cleared</title>
<link rel="stylesheet" href="assets/02deab34320570aa.css">
<link rel="stylesheet" href="assets/4b7f1220c1ed02d1.css">
<style>
.wf{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 16px;background:#e9eeee;color:#16191b;font:13px/1.2 system-ui,sans-serif}
.wf b{font-size:11px;letter-spacing:.08em;color:#4a5a5a}
.wf button{display:inline-flex;align-items:center;gap:7px;border-radius:100px;padding:4px 11px 4px 5px;background:#fff;color:#16191b;border:1px solid #c9d0d4;font:inherit;cursor:pointer}
.wf button i{font-style:normal;display:inline-flex;width:19px;height:19px;border-radius:50%;align-items:center;justify-content:center;background:#e3e8e8;font-size:11px;font-weight:700}
.wf button.on{background:#16191b;color:#fff;border-color:#16191b}
.wf button.on i{background:#3f6f6d;color:#fff}
</style>
</head>
<body class="antialiased">
<div class="wf" id="wf"></div>
<div id="app" class="fixed inset-x-0 bottom-0 flex flex-col overflow-hidden min-[820px]:grid min-[820px]:grid-cols-[212px_1fr] min-[820px]:grid-rows-[52px_1fr] min-[820px]:[grid-template-areas:'brand_top'_'nav_main']">
  <div class="hidden items-center gap-2 bg-nav px-4 min-[820px]:flex min-[820px]:[grid-area:brand]"><span class="text-[13px] font-semibold tracking-tight text-navactive">Masdar City Console</span></div>
  <header class="flex items-center gap-3 border-b border-border bg-card px-3 h-13 shrink-0 min-[820px]:[grid-area:top]"><div class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">Service request</span></div><div class="hidden h-8 w-72 items-center gap-2 rounded-md border border-border bg-panel px-2.5 text-xs text-muted-foreground md:flex"><span class="flex-1 text-left">Account, company, person or SR</span><kbd class="rounded border border-border px-1 font-mono text-[10px]">⌘K</kbd></div><div class="hidden items-center gap-2 border-l border-border pl-3 sm:flex"><div class="text-right leading-tight"><div class="text-xs font-medium">GS Officer (Demo)</div><div class="font-mono text-[10px] text-muted-foreground">GS Team</div></div></div></header>
  <nav class="flex flex-row gap-1 overflow-x-auto bg-nav py-2 min-[820px]:flex-col min-[820px]:gap-0 min-[820px]:py-3 shrink-0 min-[820px]:[grid-area:nav]" id="nav"></nav>
  <main class="flex-1 overflow-auto overscroll-contain bg-background min-[820px]:[grid-area:main]" id="main"></main>
</div>
<script>
/* Invented case. Paid AED 17,520 (Business One, 2 years); AED 500 kept per manager check (decisions.md, 3 Oct 2026). */
const PAID=17520, CHECK=500;
let S={s:1, pick:'Someone new', how:'Chat'};
const aed=n=>'AED '+n.toLocaleString('en-US');
const esc=t=>String(t);
const btn=(t,a='')=>`<button type="button" ${a} class="inline-flex h-9 shrink-0 items-center rounded-md border border-border px-3 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground">${t}</button>`;
const btnP=(t,a='')=>`<button type="button" ${a} class="inline-flex h-9 shrink-0 items-center rounded-md bg-foreground px-3 text-sm font-medium text-background">${t}</button>`;
const more=`<button type="button" class="inline-flex h-9 items-center gap-1.5 rounded-md border border-border px-3 text-sm text-muted-foreground">More<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-3.5"><path d="m6 9 6 6 6-6"/></svg></button>`;
const chip=(t,on,a)=>`<span class="rounded px-1.5 py-0.5 text-[10px] ${on}">${t}</span>`;

function nav(){
  const L=[['Dashboard'],['@Work'],['Work queue',1,'50'],['Accounts'],['Document review',0,'94'],['Client follow-ups'],['With ICP'],['Payments'],['CSPs'],['Closed cases'],['@Insight'],['What to check'],['@Admin'],['Team']];
  return L.map(([t,on,n])=>t[0]==='@'?`<div class="label-cap hidden px-3 pb-1.5 pt-4 text-navfg/60 min-[820px]:block">${t.slice(1)}</div>`:`<a class="flex w-full shrink-0 items-center gap-2.5 border-l-2 py-2 pl-3 pr-2.5 text-left text-[13px] font-medium ${on?'border-brand bg-white/[0.04] text-navactive':'border-transparent text-navfg'}"><span class="whitespace-nowrap">${t}</span>${n?`<span class="tnum ml-auto inline-flex min-w-5 items-center justify-center rounded-full px-1.5 py-0.5 text-[10px] font-semibold ${t==='Document review'?'bg-warn text-white':'bg-white/10 text-navfg'}">${n}</span>`:''}</a>`).join('');
}

function stepper(){
  const st=[['Payment','13m','done'],['Registration','8m','done'],['Security Check','2d 4h','now'],['Compliance','compliance'],['Manager/Senior Approval','director'],['Release Queue','director']];
  const closed=S.s===7;
  return `<div class="grid gap-x-3" style="grid-template-columns:repeat(6,minmax(0,1fr))"><span class="label-cap col-start-1 text-muted-foreground">Licensing</span></div><div class="mt-2 grid gap-x-3" style="grid-template-columns:repeat(6,minmax(0,1fr))">${st.map(([t,sub,k],i)=>{const done=k==='done', now=k==='now';
    const dot=done?'border-ok/50 bg-ok-wash text-ok':now&&!closed?'border-warn bg-warn-wash text-warn ring-2 ring-warn/30':'border-border bg-panel2 text-muted-foreground';
    return `<div class="min-w-0 rounded pr-3"><div class="relative mb-2 h-[22px]">${i<5?`<span class="absolute left-[11px] right-[-12px] top-1/2 h-px -translate-y-1/2 ${done?'bg-ok/45':'bg-border'}"></span>`:''}<span class="relative z-10 flex size-[22px] items-center justify-center rounded-full border text-[10px] font-mono tnum ${dot}">${done?'✓':i+1}</span></div><div class="truncate text-[12.5px] leading-tight ${now?'font-semibold text-foreground':done?'text-foreground':'text-muted-foreground'}">${t}</div><div class="mt-0.5 truncate text-[10.5px] text-muted-foreground">${sub}</div></div>`}).join('')}</div>`;
}

const mgr=()=>S.pick==='Someone new'?'Omar Khalil':S.pick;
function next(){
  const box=(label,h,p,acts,below='')=>`<div class="rounded-lg border border-border bg-panel p-4"><div class="flex items-start justify-between gap-4"><div class="min-w-0"><div class="label-cap text-muted-foreground">${label}</div><h2 class="mt-1.5 text-lg font-semibold text-foreground">${h}</h2>${p?`<p class="mt-1 max-w-[70ch] text-sm text-muted-foreground">${p}</p>`:''}</div><div class="flex shrink-0 flex-wrap items-start justify-end gap-2">${acts}</div></div>${below}</div>`;
  const how=`<div class="mt-3 text-xs text-muted-foreground">Asked by</div><div class="mt-1.5 flex flex-wrap gap-1.5">${['Chat','Call','Email'].map(w=>`<button data-how="${w}" class="rounded-full border px-2.5 py-1 text-xs ${S.how===w?'border-brand/40 bg-wash text-link':'border-border text-muted-foreground'}">${w}</button>`).join('')}</div>`;
  const panel=(title,body,foot)=>`<div class="mt-4 rounded-md border border-border bg-panel2 p-3"><div class="text-sm font-semibold">${title}</div>${body}<div class="mt-3 flex justify-end gap-2">${foot}</div></div>`;
  const row=(k,v,b)=>`<div class="flex items-center justify-between gap-3 py-1.5 text-sm ${b?'border-t border-border font-semibold':''}"><span class="${b?'':'text-muted-foreground'}">${k}</span><span class="tnum">${v}</span></div>`;
  if(S.s===1) return box('Do this next','Upload the security clearance certificate ICP returned','Upload the certificate ICP returned. The establishment card cannot be filed without it.',btn('Upload certificate')+btn('Not cleared','data-go="2"')+more);
  if(S.s===2) return box('Waiting on the applicant','New manager or withdrawal','',btn('Choose manager','data-go="3"')+btn('Withdraw','data-go="6"')+more);
  if(S.s===3){ const C=[['Marco Bellini','Shareholder'],['James Whitfield','Director'],['Someone new','']];
    const list=`<div class="mt-2 overflow-hidden rounded-md border border-border">${C.map(([n,r])=>`<button data-pick="${n}" class="flex w-full items-center gap-3 border-t border-border px-3 py-2 text-left first:border-t-0"><span class="flex size-4 items-center justify-center rounded-full border ${S.pick===n?'border-brand':'border-border'}">${S.pick===n?'<span class="size-2 rounded-full bg-brand"></span>':''}</span><span class="text-sm">${n}</span>${r?`<span class="ml-auto text-xs text-muted-foreground">${r}</span>`:''}</button>`).join('')}</div>`;
    const fresh=S.pick==='Someone new'?`<div class="mt-2 grid gap-2">${[['Name','Omar Khalil'],['Email','omar@harbour-interiors.example']].map(([k,v])=>`<div class="flex items-center gap-3 text-sm"><span class="shrink-0 text-muted-foreground" style="width:4rem">${k}</span><input class="h-8 flex-1 rounded-md border border-border bg-background px-2 text-sm" value="${v}"></div>`).join('')}<div class="flex items-center gap-3 text-sm"><span class="shrink-0 text-muted-foreground" style="width:4rem">Passport</span><span>omar-khalil-passport.pdf</span></div></div>`:'';
    return box('Waiting on the applicant','New manager or withdrawal','',more,panel('Choose manager',list+fresh+how,btn('Cancel','data-go="2"')+btnP('Send AED 500 payment link','data-go="4"')));
  }
  if(S.s===4) return box('Waiting on the applicant','AED 500 payment link sent',`${mgr()} · asked by ${S.how.toLowerCase()}`,btn('Resend')+btn('Copy link')+more);
  if(S.s===5) return box('Do this next','Send the manager security check letter to ICP',`${mgr()} · AED 500 paid`,btn('Review for ICP')+btn('Record as sent')+more);
  if(S.s===6) return box('Waiting on the applicant','New manager or withdrawal','',more,panel('Withdraw',`<div class="mt-2">${row('Paid',aed(PAID))}${row('Manager check','−'+aed(CHECK))}${row('Refund',aed(PAID-CHECK),1)}</div>`+how,btn('Cancel','data-go="2"')+btnP('Withdraw and refund','data-go="7"')));
  if(S.s===7) return box('Closed','Withdrawn',`${aed(PAID-CHECK)} refunded to the card · asked by ${S.how.toLowerCase()}`,'');
}

function authority(){
  const li=(name,tag,tone,line,num)=>`<li class="flex items-start justify-between gap-4"><div class="min-w-0"><div class="flex items-center gap-2"><span class="text-sm font-medium text-foreground">${name}</span>${chip(tag,tone)}</div><div class="mt-0.5 text-xs text-muted-foreground">${line}</div><div class="mt-1.5 inline-flex items-center gap-2 rounded border border-border bg-panel2 px-2 py-1"><span class="font-mono text-[9px] uppercase tracking-wide text-muted-foreground">ICP request number</span><span class="font-mono text-xs font-semibold text-foreground">${num}</span></div></div></li>`;
  const first=S.s===1?li('Manager security check · Layla Haddad','waiting','bg-panel2 text-muted-foreground','Sent to ICP on 1 October.','55120'):li('Manager security check · Layla Haddad','not cleared','bg-danger-wash text-danger','ICP replied on 3 October.','55120');
  const second=S.s===5?li(`Manager security check · ${mgr()}`,'to send','bg-panel2 text-muted-foreground','AED 500 paid on 3 October.','None yet'):'';
  return `<div class="rounded-lg border border-border bg-panel p-4"><div class="label-cap text-muted-foreground">With the authority</div><ul class="mt-3 list-none space-y-3">${second}${first}</ul></div>`;
}

function page(){
  const section=(h,rows)=>`<section class="overflow-hidden rounded-lg border border-border bg-panel"><header class="flex items-center justify-between gap-3 border-b border-border px-4 py-3"><h3 class="text-sm font-semibold text-foreground">${h}</h3></header><div class="divide-y divide-border">${rows.map(([k,v])=>`<div class="flex items-baseline gap-4 px-4 py-2.5 text-sm"><span class="w-40 shrink-0 text-muted-foreground">${k}</span><span class="min-w-0 flex-1 text-foreground">${v}</span></div>`).join('')}</div></section>`;
  const tabs=['Application','Applicant Documents','Internal Documents','ICP Documents','Ownership','Compliance','Payments','Activity'];
  return `<div class="mx-auto max-w-6xl px-4 pt-6 min-[820px]:px-8"><nav class="mb-2 flex flex-wrap items-center gap-1.5 text-xs text-muted-foreground"><span>Accounts</span><span>/</span><span>Harbour Interiors Limited</span><span>/</span><span class="text-foreground">SR-87031</span></nav></div>
  <div class="mx-auto max-w-6xl px-6 py-6"><div class="overflow-hidden rounded-xl border border-border bg-panel"><div class="px-5 py-4"><div class="flex flex-wrap items-start justify-between gap-4"><div class="min-w-0"><div class="flex items-center gap-2"><span class="tnum font-mono text-xs text-muted-foreground">SR-87031</span><span dir="rtl" class="text-sm text-muted-foreground">هاربر انتيريورز ليمتد</span></div><h1 class="mt-1 text-2xl font-semibold tracking-tight">Harbour Interiors Limited</h1><div class="mt-2 flex flex-wrap items-center gap-2"><span class="inline-flex items-center gap-1.5 text-xs font-medium ${S.s===7?'text-muted-foreground':'text-ok'}">${S.s===7?'Withdrawn · refunded':'Paid'}</span></div></div><div class="flex shrink-0 items-start gap-7"><div class="text-right text-xs text-muted-foreground"><div>Created Wed, 01 Oct 2026</div><div class="mt-0.5">layla@harbour-interiors.example</div></div><div class="text-right"><div class="label-cap text-muted-foreground">Risk</div><div class="mt-0.5 text-[26px] leading-none tracking-tight text-warn font-semibold">Medium</div><div class="tnum mt-1 text-[11px] text-muted-foreground">Score 14.4</div></div></div></div></div><div class="h-px bg-border"></div><div class="px-5 pb-3.5 pt-4">${stepper()}</div></div>
  <div class="space-y-3 mt-5">${next()}${authority()}</div>
  <div class="mt-3 rounded-lg border border-border bg-panel px-4 py-3"><div class="flex w-full items-center gap-x-2"><div class="label-cap text-muted-foreground">Step record · Security Check</div><span class="ml-auto text-xs ${S.s===7?'text-muted-foreground':'text-warn'}">${S.s===7?'closed':'1 to do'}</span></div></div>
  <div class="mt-5"><div class="flex items-center gap-1 border-b border-border">${tabs.map((t,i)=>`<span class="relative px-3 py-2 text-sm ${i?'text-muted-foreground':'font-medium text-foreground'}">${t}${i?'':'<span class="absolute inset-x-2 -bottom-px h-0.5 rounded bg-accent"></span>'}</span>`).join('')}</div>
  <div class="py-4"><div class="grid items-start gap-4 lg:grid-cols-2"><div class="space-y-4">${section('Legal Structure',[['Type','Limited company (L.L.C-FZ)']])}${section('Stakeholders',[['Layla Haddad','Shareholder · Director · Manager · Legal representative'],['Marco Bellini','Shareholder'],['James Whitfield','Director']])}</div><div class="space-y-4">${section('Company Name',[['Name','Harbour Interiors Limited'],['Arabic','<span dir="rtl">هاربر انتيريورز ليمتد</span>']])}</div></div></div></div></div>`;
}

const STRIP=[[1,'Waiting on ICP'],[2,'Not cleared'],[3,'Choose manager'],[4,'Link sent'],[5,'Paid, back to ICP'],[6,'Withdraw'],[7,'Withdrawn']];
function render(){
  document.getElementById('wf').innerHTML='<b>WIREFRAME</b>'+STRIP.map(([n,t])=>`<button data-go="${n}" class="${S.s===n?'on':''}"><i>${n}</i>${t}</button>`).join('');
  document.getElementById('nav').innerHTML=nav();
  document.getElementById('main').innerHTML=page();
  document.getElementById('app').style.top=document.getElementById('wf').offsetHeight+'px';
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){S.s=+g.dataset.go; render(); return}
  const p=e.target.closest('[data-pick]'); if(p){S.pick=p.dataset.pick; render(); return}
  const h=e.target.closest('[data-how]'); if(h){S.how=h.dataset.how; render(); return}
});
render();
</script>
</body>
</html>
