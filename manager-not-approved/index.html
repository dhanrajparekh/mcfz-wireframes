<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manager Not Approved</title>
<link rel="stylesheet" href="assets/app.css">
<style>
body{background:var(--background)}
.wf{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:9px 16px;background:#16191b;color:#e9eeee;font:13px/1.2 system-ui,sans-serif}
.wf b{font-size:11px;letter-spacing:.08em;color:#9fb3b3}
.wf .sep{width:1px;height:22px;background:#3a4a49;margin:0 4px}
.wf button{display:inline-flex;align-items:center;gap:7px;border-radius:100px;padding:4px 11px 4px 5px;background:#24302f;color:#fff;border:1px solid #3a4a49;font:inherit;cursor:pointer}
.wf button i{font-style:normal;display:inline-flex;width:19px;height:19px;border-radius:50%;align-items:center;justify-content:center;background:#3a4a49;font-size:11px;font-weight:700}
.wf button.on{background:#e9eeee;color:#16191b;border-color:#e9eeee}
.wf button.on i{background:#3f6f6d;color:#fff}
.app{top:42px!important}
</style>
</head>
<body>
<div class="wf" id="wf"></div>
<div class="app fixed inset-0 flex h-dvh min-h-0 w-full overflow-clip bg-background" style="height:calc(100dvh - 42px)">
  <aside class="hidden w-62 shrink-0 flex-col lg:flex">
    <div class="flex h-14 shrink-0 items-center px-4 lg:mt-3 lg:pt-[9px]"><a class="block min-w-0 no-underline"><span class="block font-display text-xl leading-none font-bold uppercase text-foreground">Masdar City</span><span class="mt-[3px] block text-xs leading-none font-bold tracking-[0.14em] uppercase text-brand-text">Innovation Zone</span></a></div>
    <div class="shrink-0 px-3 pt-3 pb-2"><div class="flex w-full items-center gap-2 rounded-md border border-border bg-muted px-3 py-2 text-left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 shrink-0 text-brand-text"><path d="M10 12h4"/><path d="M10 8h4"/><path d="M14 21v-3a2 2 0 0 0-4 0v3"/><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"/><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/></svg><span class="min-w-0 flex-1"><span class="block text-xs font-bold tracking-[0.08em] uppercase text-muted-foreground">Application</span><span class="block truncate text-base font-bold text-foreground">Harbour Interiors Limited</span></span></div></div>
    <div class="min-h-0 flex-1 overflow-y-auto px-3 py-3"><nav class="flex flex-col gap-0.5" id="nav"></nav></div>
    <div class="shrink-0 p-3 pt-1"><div class="flex w-full items-center gap-2 rounded-md p-2"><span class="flex size-7 shrink-0 items-center justify-center rounded-full bg-brand-strong font-display text-base font-bold text-brand-foreground">L</span><span class="min-w-0 flex-1"><span class="block text-xs font-bold tracking-[0.08em] uppercase text-muted-foreground">Signed in</span><span class="block truncate text-base font-bold">layla@harbour-interiors.example</span></span></div></div>
  </aside>
  <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden bg-canvas shadow-card lg:my-3 lg:mr-3 lg:rounded-xl">
    <header class="flex min-h-14 shrink-0 items-center gap-3 px-4 pt-5 pb-3 lg:px-6"><div class="min-w-0 flex-1"><h1 class="truncate text-xl leading-none">Harbour Interiors Limited</h1><p class="mt-1 truncate text-base text-muted-foreground">Masdar City Free Zone</p></div></header>
    <main class="min-h-0 flex-1 overflow-x-hidden overflow-y-auto px-4 pt-3 pb-6 lg:px-6"><div class="w-full max-w-[1440px]" id="main"></div></main>
  </div>
</div>
<div id="dlg"></div>
<script>
/* Invented people. Amounts: Business One, 2 years, AED 17,520 (registration wireframe); AED 500 per manager check (decisions.md, 3 Oct 2026). */
const PAID=17520, CHECK=500;
const PEOPLE=[['marco','Marco Bellini','Italy · Shareholder'],['james','James Whitfield','United Kingdom · Director'],['new','Someone new','Not on the application yet']];
let S={s:1, pick:'marco', checks:1};

const aed=n=>'AED '+n.toLocaleString('en-US');
const ico={ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="size-3"><path d="M20 6 9 17l-5-5"/></svg>'};
const btnP=(t,a='')=>`<button type="button" ${a} class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-pill font-bold whitespace-nowrap bg-brand-strong text-brand-foreground hover:bg-brand-deep h-8 gap-1.5 px-4 text-base">${t}</button>`;
const btnO=(t,a='')=>`<button type="button" ${a} class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-pill font-bold whitespace-nowrap border bg-background shadow-xs hover:bg-accent h-8 gap-1.5 px-4 text-base">${t}</button>`;
const btnD=(t,a='')=>`<button type="button" ${a} class="inline-flex shrink-0 cursor-pointer items-center justify-center rounded-pill font-bold whitespace-nowrap bg-destructive text-white h-8 gap-1.5 px-4 text-base">${t}</button>`;
const card=(title,inner)=>`<div class="flex flex-col gap-4 rounded-card border border-border bg-card p-5 text-card-foreground shadow-card"><div class="font-display text-lg leading-none font-bold">${title}</div>${inner}</div>`;

const NICO={"Overview": "<rect width=\"7\" height=\"9\" x=\"3\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"5\" x=\"14\" y=\"3\" rx=\"1\"/><rect width=\"7\" height=\"9\" x=\"14\" y=\"12\" rx=\"1\"/><rect width=\"7\" height=\"5\" x=\"3\" y=\"16\" rx=\"1\"/>", "Company": "<path d=\"M10 12h4\"/><path d=\"M10 8h4\"/><path d=\"M14 21v-3a2 2 0 0 0-4 0v3\"/><path d=\"M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2\"/><path d=\"M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16\"/>", "People": "<path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"/><path d=\"M16 3.128a4 4 0 0 1 0 7.744\"/><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"/><circle cx=\"9\" cy=\"7\" r=\"4\"/>", "Documents": "<path d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\"/><path d=\"M14 2v5a1 1 0 0 0 1 1h5\"/><path d=\"M10 9H8\"/><path d=\"M16 13H8\"/><path d=\"M16 17H8\"/>", "Payments": "<rect width=\"20\" height=\"14\" x=\"2\" y=\"5\" rx=\"2\"/><line x1=\"2\" x2=\"22\" y1=\"10\" y2=\"10\"/>", "Share access": "<path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"/>", "Government services": "<path d=\"M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z\"/>"};
function nav(){
  const L=[['Overview',1],['Company'],['People'],['Documents',0,'3'],['Payments'],['Share access'],['Government services',0,'After licence']];
  return L.map(([t,on,tag])=>`<a class="group flex min-h-9 items-center gap-2.5 rounded-md px-2 text-base no-underline ${on?'bg-sidebar-accent text-sidebar-accent-foreground font-bold':'font-medium text-muted-foreground'}"><span class="flex size-5 shrink-0 items-center justify-center rounded-full border text-xs ${on?'border-brand-border text-brand-text':'border-border text-muted-foreground'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5">${NICO[t]}</svg></span><span class="min-w-0 flex-1 truncate">${t}</span>${tag?`<span class="shrink-0 text-xs tabular text-muted-foreground">${tag}</span>`:''}</a>`).join('');
}

/* the one card that changes */
function status(){
  const mgr=S.pick==='james'?'James Whitfield':S.pick==='new'?'Omar Khalil':'Marco Bellini';
  const bar=(pct,step)=>`<div class="flex flex-col gap-2"><div class="h-1.5 overflow-hidden rounded-full bg-surface-sunken"><span class="block h-full rounded-full bg-brand-strong" style="width:${pct}%"></span></div><p class="text-xs tracking-[0.04em] text-muted-foreground tabular">Step ${step} of 9</p></div>`;
  const calm=(eye,h,p,extra='')=>`<div class="flex flex-col rounded-card border p-5 text-card-foreground shadow-card gap-5 border-brand-border/60 bg-brand-subtle/40"><div><span class="eyebrow-label">${eye}</span><h2 class="text-2xl leading-none mt-1.5">${h}</h2></div><p class="text-md text-foreground">${p}</p>${extra}</div>`;
  const act=(eye,h,p,btns)=>`<div class="flex flex-col rounded-card border p-5 text-card-foreground shadow-card gap-5 border-warning bg-warning-subtle"><div><span class="eyebrow-label">${eye}</span><h2 class="text-2xl leading-none mt-1.5">${h}</h2></div><p class="text-md text-foreground">${p}</p><div class="flex flex-wrap gap-2">${btns}</div></div>`;
  if(S.s===1||S.s===2||S.s===4) return act('Government','Manager not approved','ICP did not approve Layla Haddad as manager. Choose a different manager to continue, or withdraw your application.',btnP('Choose a different manager','data-go="2"')+btnO('Withdraw','data-go="4"'));
  if(S.s===11) return act('Government','Pay for your new manager check','Your case manager set Omar Khalil as manager, as you asked. Pay AED 500 so ICP can check them.',btnP('Pay AED 500','data-go="3"'));
  if(S.s===3) return calm('Government','Checking your new manager',`${mgr} is being checked with ICP. Nothing is needed from you.`,bar(33,3));
  if(S.s===5) return calm('Closed','Application withdrawn',`${aed(PAID+CHECK*(S.checks-1)-CHECK*S.checks)} has been refunded to the card or account you paid with.`);
  if(S.s===6||S.s===7||S.s===8) return act('Intake','Choose a different manager','Layla Haddad has never entered the UAE, and ICP only approve a manager who has. Nothing has been sent to ICP.',btnP('Choose a different manager','data-go="7"')+btnO('Withdraw','data-go="8"'));
  if(S.s===9) return calm('Intake','Application checks','Your proposed company name is being reserved and your documents are being verified. Nothing is needed from you.',bar(22,2));
  if(S.s===10) return calm('Closed','Application withdrawn',`${aed(PAID)} has been refunded to the card or account you paid with.`);
}

function where(){
  const at=(S.s<=5||S.s===11)?'gov':'checks', closed=S.s===5||S.s===10, need=[1,2,4,6,7,8,11].includes(S.s);
  const dot=(st)=>st==='done'?`<span class="absolute -left-[11px] top-0 flex size-5 items-center justify-center rounded-full border-2 border-brand-strong bg-brand-strong text-brand-foreground">${ico.ok}</span>`:st==='now'?`<span class="absolute -left-[11px] top-0 flex size-5 items-center justify-center rounded-full border-2 ${need?'border-warning bg-warning':'border-brand-strong bg-brand-strong'}"></span>`:`<span class="absolute -left-[11px] top-0 flex size-5 items-center justify-center rounded-full border-2 bg-card border-border"></span>`;
  const pill=need?'<span class="rounded-full bg-warning whitespace-nowrap px-2 py-0.5 text-xs font-bold tracking-[0.06em] uppercase text-white">Action needed</span>':closed?'<span class="rounded-full border border-border whitespace-nowrap px-2 py-0.5 text-xs font-bold tracking-[0.06em] uppercase text-muted-foreground">Withdrawn</span>':'<span class="rounded-full bg-brand-strong whitespace-nowrap px-2 py-0.5 text-xs font-bold tracking-[0.06em] uppercase text-brand-foreground">Now</span>';
  const li=(t,st,last)=>`<li class="relative ml-[11px] flex gap-3 border-l-2 pl-[21px] ${last?'border-transparent pb-0':'pb-4 '+(st==='done'?'border-brand-border':'border-border')}">${dot(st)}<div class="min-w-0"><div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-md ${st==='todo'?'text-muted-foreground':'text-foreground'} ${st==='now'?'font-bold':''}"><span>${t}</span>${st==='now'?pill:''}</div></div></li>`;
  const sec=(h,on,items,p='')=>`<section><header class="mb-3 pl-[34px]"><h3 class="text-base tracking-[0.04em] ${on?'text-brand-text':'text-muted-foreground'}">${h}</h3>${p?`<p class="mt-1 text-base text-muted-foreground">${p}</p>`:''}</header><ol class="list-none">${items}</ol></section>`;
  const chk=at==='gov'?'done':'now', gov=at==='gov'?'now':'todo';
  return card('Where Things Are',`<div class="flex flex-col gap-5">${sec('Intake',at==='checks','<!---->'+li('Payment confirmed','done')+li('Application checks',chk,1),'Your payment and your application are confirmed.')}${sec('Government',at==='gov',li('Government processing',gov,1))}${sec('Review',0,li('Final review','todo')+li('Approval','todo',1))}${sec('Issue',0,li('Licence documents','todo',1))}${sec('Immigration',0,li('Establishment card','todo')+li('eChannel account','todo')+li('Residency visas','todo',1))}</div>`).replace('pl-[34px]">','pl-[34px]">').replace('<div class="font-display','<div class="pl-[34px] font-display');
}

function page(){
  const caseMgr=card('Your Case Manager',`<div class="flex items-center gap-3"><span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-brand-subtle text-sm font-bold text-brand-text">MC</span><div class="min-w-0"><span class="block font-bold">Masdar City Team</span><span class="block text-base text-muted-foreground">We answer during Abu Dhabi office hours.</span></div></div><div class="flex flex-wrap gap-2">${btnO('Book a call')}</div>`);
  const dl=(rows)=>`<dl class="grid grid-cols-[8rem_minmax(0,1fr)] items-baseline gap-x-4 gap-y-2.5 text-md">${rows.map(([k,v])=>`<dt class="text-base text-muted-foreground">${k}</dt><dd class="tabular">${v}</dd>`).join('')}</dl>`;
  const company=card('Your Company',dl([['Name','Harbour Interiors Limited'],['Type','Limited company'],['People','3'],['Visas','1'],['Paid','1 Oct 2026']])+`<div class="flex flex-wrap gap-2">${btnO('Company details')}${btnO('People')}</div>`);
  const pkg=card('Your Package',`<ul class="flex list-none flex-col gap-3"><li><span class="block text-md">Your licence pack</span><span class="block text-base text-muted-foreground">Trade licence, certificate of incorporation, Memorandum of Association, Articles of Association and a flexi-desk lease agreement, included in every package.</span></li><li><span class="block text-md">1 visa, end to end</span><span class="block text-base text-muted-foreground">E-Channel registration, the establishment card, the residence visa, the medical fitness test and the Emirates ID.</span></li></ul>`);
  return `<div class="grid items-start gap-4 lg:grid-cols-[minmax(0,1fr)_20rem]"><div class="flex min-w-0 flex-col gap-4">${caseMgr}${status()}<div class="grid gap-4 xl:grid-cols-2">${company}${pkg}</div></div><aside>${where()}</aside></div>`;
}

/* dialogs */
function dialog(){
  const shell=(title,body,foot)=>`<div class="fixed inset-0 z-50 bg-black/50" data-go="${S.s===7?6:1}"></div><div class="fixed z-50 grid gap-4 rounded-card border border-border bg-background p-6 shadow-lg" style="left:50%;top:50%;transform:translate(-50%,-50%);width:min(32rem,calc(100% - 32px));max-height:calc(100dvh - 80px);overflow-y:auto"><h2 class="text-xl">${title}</h2>${body}<div class="flex flex-wrap items-center justify-end gap-2">${foot}</div></div>`;
  const radio=on=>`<span style="display:inline-block;width:18px;height:18px;border-radius:50%;flex-shrink:0;box-sizing:border-box;border:${on?'5px solid var(--brand-strong)':'1.5px solid var(--border)'};background:var(--card)"></span>`;
  const inp=(l,v)=>`<label class="grid gap-1.5"><span class="text-base text-muted-foreground">${l}</span><input class="h-10 w-full rounded-card border border-input bg-transparent px-3 text-md" value="${v}"></label>`;
  if(S.s===2||S.s===7){ const free=S.s===7;
    const list=`<div class="overflow-hidden rounded-card border border-border">${PEOPLE.map(([k,n,sub])=>`<button type="button" data-pick="${k}" class="flex w-full items-center gap-3 border-b border-border px-4 py-3 text-left last:border-b-0">${radio(S.pick===k)}<span class="min-w-0"><span class="block font-bold">${n}</span><span class="block text-base text-muted-foreground">${sub}</span></span></button>`).join('')}</div>`;
    const fresh=S.pick==='new'?`<div class="grid gap-3">${inp('Full name, as on the passport','Omar Khalil')}${inp('Email','omar@harbour-interiors.example')}${inp('Mobile','+971 50 000 2210')}<div class="flex items-center justify-between rounded-card border border-border px-4 py-3"><span><b class="block">Passport</b><span class="text-base text-muted-foreground">omar-khalil-passport.pdf</span></span><span class="text-base font-bold text-brand-text underline">Replace</span></div></div>`:'';
    return shell('Choose a Different Manager',`<p class="text-md text-muted-foreground">The manager must have entered the UAE before.</p>${list}${fresh}<div class="flex items-baseline justify-between border-t border-border pt-3 text-md"><span>${free?'Manager check':'Manager check'}</span><b class="tabular">${free?'No charge':aed(CHECK)}</b></div>`,btnO('Cancel',`data-go="${free?6:1}"`)+(free?btnP('Save manager','data-go="9"'):btnP('Pay '+aed(CHECK)+' and Continue','data-go="3"')));
  }
  if(S.s===4||S.s===8){ const full=S.s===8, kept=full?0:CHECK, ref=PAID-kept;
    const row=(k,v,b)=>`<div class="flex items-baseline justify-between gap-3 text-md ${b?'font-bold border-t-2 border-border pt-3':''}"><span class="${b?'':'text-muted-foreground'}">${k}</span><span class="tabular">${v}</span></div>`;
    return shell('Withdraw Your Application?',`<div class="flex flex-col gap-2">${row('Paid',aed(PAID))}${full?row('Manager check','Not run'):row('Manager check','−'+aed(kept))}${row('Refund',aed(ref),1)}</div><p class="text-base text-muted-foreground">Refunded to the card or account you paid with.</p>`,btnO('Cancel',`data-go="${full?6:1}"`)+btnD('Withdraw and refund '+aed(ref),`data-go="${full?10:5}"`));
  }
  return '';
}

/* wireframe strip: every screen in order, one click each */
const STRIP=[['ICP did not approve the manager',[[1,'Not approved'],[2,'New manager'],[3,'Checking'],[4,'Withdraw'],[5,'Withdrawn']]],['Chosen by your case manager',[[11,'Pay for the check']]],['Never entered the UAE',[[6,'Stopped'],[7,'New manager, free'],[8,'Full refund']]]];
const stripOn=()=>({9:7,10:8})[S.s]||S.s;
function render(){
  let k=0; document.getElementById('wf').innerHTML='<b>WIREFRAME</b>'+STRIP.map(([g,l],gi)=>(gi?'<span class="sep"></span>':'')+l.map(([n,t])=>`<button data-go="${n}" class="${stripOn()===n?'on':''}"><i>${++k}</i>${t}</button>`).join('')).join('');
  document.getElementById('nav').innerHTML=nav();
  document.getElementById('main').innerHTML=page();
  document.getElementById('dlg').innerHTML=dialog();
  const h=document.getElementById('wf').offsetHeight, a=document.querySelector('.app'); a.style.setProperty('top',h+'px','important'); a.style.height=`calc(100dvh - ${h}px)`;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){S.s=+g.dataset.go; if(S.s===1||S.s===6) S.pick='marco'; if(S.s===11) S.pick='new'; render(); return}
  const p=e.target.closest('[data-pick]'); if(p){S.pick=p.dataset.pick; render(); return}
});
render();
</script>
</body>
</html>
